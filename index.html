<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Фреймы с текстом</title>
  <style>
    /* обнулила отступы, потому что выходила херня */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #2b2b2b; /* основной фрейм - чёрный, в центр экрана херачу */
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh; /* высота в экран вывода */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* Главный черный фрейм */
    .main-frame {
      display: flex;
      flex-direction: column; /* Режем верх и низ */
      gap: 10px;
      background-color: #111111;
      padding: 15px; /* отсутп от главного фрейма */
      border-radius: 8px;
      width: max-content; /* Ширина подстроится под внутренние блоки */
    }

    /* Секции: я поделила на верхнюю и нижнюю и сделала так, чтобы они шли друг за другом (т.е. слева на право)*/
    .top-section {
      display: flex;
      flex-direction: row; /* Мини-фреймы идут слева направо */
      gap: 10px;
    }

    .bottom-section {
      display: flex;
      flex-direction: row; /* Мини-фреймы идут слева направо */
      gap: 10px;
    }

    /* Внутри верха и низа */
    .column {
      display: flex;
      flex-direction: column; /* мини-фреймы идут сверху вниз */
      gap: 10px;
    }

    .row {
      display: flex;
      flex-direction: row; /* мини-фреймы идут слева направо */
      gap: 10px;
    }

    /* Мини-фреймы внутри */
    .box {
      background-color: #ffffff;
      border-radius: 6px;
      display: flex;
      justify-content: center; /* Центрируем текст по горизонтали */
      align-items: center;     /* Центрируем текст по вертикали */
      font-size: 24px;
      font-weight: bold;
      color: #1d1d1f;
    }

    /* Размер блоков, на который я поделила большой чёрный фрейм */
    
    /* Верхняя часть (три колонки) */
    .left-col { width: 170px; }
    .mid-col { width: 350px; } /* Ширина двух маленьких блоков + отступ (170+170+10) */
    .right-col { width: 170px; }

    /* Мини-фреймы внутри левой колонки */
    .box-a { height: 180px; }
    .box-e { height: 120px; }

    /* Мини-фреймы внутри средней колонки */
    .box-b { width: 170px; height: 120px; }
    .box-c { width: 170px; height: 120px; }
    .box-f { width: 350px; height: 180px; }

    /* Мини-фрейм в правой колонке */
    .box-d { height: 310px; } /* Выравниваю по высоте с левой колонкой*/

    /* Мини-фреймы нижней секции */
    .box-g { width: 350px; height: 140px; } /* Широкий мини-фрейм под левой и частью средней колонки */
    .box-h { width: 170px; height: 140px; }
    .box-i { width: 170px; height: 140px; }
  </style>
</head>
<body>

  <div class="main-frame">
    
    <!-- Верхняя часть -->
    <div class="top-section">
      
      <!-- Левая подчасть -->
      <div class="column left-col">
        <div class="box box-a">Everyone</div> 
        <div class="box box-e">not</div>      
      </div>

      <!-- Средняя подчасть -->
      <div class="column mid-col">
        <div class="row">
          <div class="box box-b">can</div>      
          <div class="box box-c">promise,</div> 
        </div>
        <div class="box box-f">everyone</div> 
      </div>

      <!-- Правая подчасть -->
      <div class="column right-col">
        <div class="box box-d">but</div>      
      </div>

    </div>

    <!-- Нижния часть -->
    <div class="bottom-section">
      <div class="box box-g">can</div>          
      <div class="box box-h">keep</div>         
      <div class="box box-i">that promise</div> 
    </div>

  </div>

</body>
</html>
